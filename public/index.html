<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>BiolApp Store · Biolab</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./lib/app/images/brand/biolab-mark.png">

    <link rel="stylesheet" href="./lib/plugins/fontawesome-free-5.14.0-web/css/all.min.css">
    <link rel="stylesheet" href="./lib/plugins/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="./lib/app/css/portal.css?v=1.3.0">
    <!-- Biolab ortak tema: en son yüklenir (bootstrap düğme rengini kurumsal renge çeker) -->
    <link rel="stylesheet" href="./lib/app/css/biolab-theme.css?v=1.0.1">
</head>
<body>

<header class="portal-header">
    <div class="portal-container header-inner">
        <div class="header-brand">
            <a href="./" class="header-logo" title="BiolApp Store">
                <img src="./lib/app/images/brand/biolab-logo.png" alt="Biolab Laboratuvarlar Grubu">
            </a>
            <span class="header-divider" aria-hidden="true"></span>
            <a href="./" class="header-app" title="BiolApp Store">
                <span class="header-app-icon" aria-hidden="true"><i class="fas fa-th-large"></i></span>
                <span class="header-app-name">Biol<span class="accent">App</span> <span class="light">Store</span></span>
            </a>
        </div>
        <div class="header-meta">
            <span class="header-tag"><i class="fas fa-shield-alt"></i> Kurum uygulamaları</span>
            <span><i class="fas fa-calendar ml-2"></i></span>
            <span class="header-date js-today"></span>
        </div>
    </div>
</header>

<section class="portal-hero">
    <div class="portal-container">
        <p class="hero-eyebrow"></p>
        <h1 class="hero-title">Biol<span class="hero-accent">App</span> Store</h1>
        <p class="hero-subtitle">Kullanmak istediğiniz uygulamayı seçin; giriş ekranına yönlendirileceksiniz.</p>
    </div>
</section>

<main class="portal-main">
    <div class="portal-container">
        <div id="appGrid" class="app-grid">
            <div class="app-message"><span class="spinner-border spinner-border-sm"></span> Yükleniyor...</div>
        </div>
    </div>
</main>

<footer class="portal-footer">
    <div class="portal-container">&copy; <span class="js-year"></span> Biolab Laboratuvarlar Grubu</div>
</footer>

<template id="appCardTpl">
    <a class="app-card">
        <span class="app-icon"><i class="fas"></i></span>
        <span class="app-body">
            <span class="app-name"></span>
            <span class="app-desc"></span>
        </span>
        <span class="app-badge">Yakında</span>
        <i class="fas fa-arrow-right app-arrow"></i>
    </a>
</template>

<script src="./lib/plugins/jquery-3.1.1/jquery-3.1.1.min.js"></script>
<script src="./lib/app/js/portal.js?v=1.1.2"></script>
</body>
</html>
