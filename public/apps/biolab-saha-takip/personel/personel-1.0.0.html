<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-tr="PAGE_TITLE">Saha personeli</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/font-awesome-5.10.2/css/all.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/datetimepicker-4.17.47/css/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/jqGrid-4.6.0/css/ui.jqgrid.css">
    <link rel="stylesheet" href="../../../lib/plugins/jqGrid-4.6.0/css/ui.jqgrid.bootstrap.css">
    <link rel="stylesheet" href="../../../lib/app/css/plugins.css">
    <link rel="stylesheet" href="../css/hb.css?v=1.3.1">
    <style>
        .st-info{
            margin-bottom: 10px;
            font-size: 12px;
            color: #667085;
        }
        .st-badge{
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .st-badge-on  { background: #e3f4e9; color: #1e6b3a; }
        .st-badge-off { background: #eceff3; color: #475467; }
        @media (max-width: 991px){
            .st-col-form{ margin-top: 16px; }
        }
    </style>
    <!-- Biolab ortak tema: en son yüklenir (bootstrap düğme rengini kurumsal renge çeker) -->
    <link rel="stylesheet" href="../../../lib/app/css/biolab-theme.css?v=1.0.1">
    <!-- Modern görünüm katmanı (yalnız tasarım; HTML / JS değişmez): en son yüklenir -->
    <link rel="stylesheet" href="../common/sht-modern.css?v=1.2.3">
</head>

<body class="frame-block">
<input type="hidden" id="clientId" name="clientId"/>
<div class="autoheight">
    <div class="container-fluid pt-3">
        <div class="row">

            <!-- Sol: personel listesi -->
            <div class="col-lg-7 col-sm-6">
                <div class="card">
                    <div class="card-header" style="background-color: #a5ccdfba">
                        <h3 class="card-title" data-tr="LIST_TITLE">Saha personeli</h3>
                    </div>
                    <div class="card-body">

                        <div class="row grid-search mb-1">
                            <div class="col-sm-12">
                                <div class="input-group input-group-sm">
                                    <label for="gridSearchField" class="sr-only" data-tr="PH_GRID_SEARCH_FIELD"></label>
                                    <input type="text" id="gridSearchField" name="gridSearchField" class="form-control form-control-sm" data-trph="PH_GRID_SEARCH_FIELD" placeholder="" autocomplete="off">
                                    <div class="input-group-append">
                                        <button class="btn btn-default btn-sm" type="button" data-tr="BTN_SEARCH_TEXT" id="btnGridSearch"></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-sm-12">
                                <table id="jqGrid"></table>
                                <div id="jqGridPager"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Sağ: personel formu -->
            <div class="col-lg-5 col-sm-6 st-col-form">
                <div class="card">
                    <div class="card-header" style="background-color: #c53cb61f">
                        <h3 class="card-title" data-tr="FORM_TITLE">Personel bilgisi</h3>
                    </div>
                    <div class="card-body">
                        <div class="st-info" data-tr="FORM_INFO"></div>

                        <form name="editFormPersonel" id="editFormPersonel" class="form-horizontal" method="post" action="javascript:" autocomplete="off" novalidate>

                            <input type="hidden" id="PERSONEL_ID" name="PERSONEL_ID"/>

                            <div class="form-group"><!--USER_ID-->
                                <label for="USER_ID" data-tr="USER_ID" class="col-form-label-sm">§§USER_ID</label>
                                <select id="USER_ID" name="USER_ID" class="form-control form-control-sm"></select>
                            </div>

                            <div class="form-group"><!--PERSONEL_CODE-->
                                <label for="PERSONEL_CODE" data-tr="PERSONEL_CODE" class="col-form-label-sm">§§PERSONEL_CODE</label>
                                <input type="text" id="PERSONEL_CODE" name="PERSONEL_CODE" class="form-control form-control-sm" maxlength="20" style="text-transform: uppercase"/>
                                <small class="form-text text-muted" data-tr="PERSONEL_CODE_INFO"></small>
                            </div>

                            <div class="row">
                                <div class="col-sm-7"><!--JOB_TYPE-->
                                    <div class="form-group">
                                        <label for="JOB_TYPE" data-tr="JOB_TYPE" class="col-form-label-sm">§§JOB_TYPE</label>
                                        <input type="text" id="JOB_TYPE" name="JOB_TYPE" class="form-control form-control-sm" maxlength="50" data-trph="PH_JOB_TYPE" placeholder=""/>
                                    </div>
                                </div>
                                <div class="col-sm-5"><!--PHONE-->
                                    <div class="form-group">
                                        <label for="PHONE" data-tr="PHONE" class="col-form-label-sm">§§PHONE</label>
                                        <input type="text" id="PHONE" name="PHONE" class="form-control form-control-sm" maxlength="20"/>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-sm-7"><!--TRACCAR_DEVICE_ID-->
                                    <div class="form-group">
                                        <label for="TRACCAR_DEVICE_ID" data-tr="TRACCAR_DEVICE_ID" class="col-form-label-sm">§§TRACCAR_DEVICE_ID</label>
                                        <input type="number" id="TRACCAR_DEVICE_ID" name="TRACCAR_DEVICE_ID" class="form-control form-control-sm" min="1"/>
                                    </div>
                                </div>
                                <div class="col-sm-5"><!--ACTIVE_FL-->
                                    <div class="form-group">
                                        <label for="ACTIVE_FL" data-tr="ACTIVE_FL" class="col-form-label-sm">§§ACTIVE_FL</label>
                                        <select id="ACTIVE_FL" name="ACTIVE_FL" class="form-control form-control-sm base">
                                            <option value="Y" data-tr="FL_YES_TEXT" selected></option>
                                            <option value="N" data-tr="FL_NO_TEXT"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <small class="form-text text-muted mb-2" data-tr="TRACCAR_DEVICE_ID_INFO"></small>

                        </form>
                    </div>
                    <div class="card-footer text-right">
                        <button type="button" class="btn btn-sm btn-warning float-left" id="btnRevokeTokens"><i class="fas fa-mobile-alt"></i> <span data-tr="BTN_REVOKE_TOKENS">Telefon oturumlarını kapat</span></button>
                        <button type="button" class="btn btn-sm btn-success btn-new" id="btnNewPersonel"><i class="fas fa-file"></i> <span data-tr="BTN_NEW_TEXT">Yeni</span></button>
                        <button type="button" class="btn btn-sm btn-default btn-cancel" id="btnCancelPersonel"><i class="fas fa-ban"></i> <span data-tr="BTN_CANCEL_TEXT">İptal</span></button>
                        <button type="button" class="btn btn-sm btn-danger btn-delete" id="btnDeletePersonel"><i class="fas fa-trash-alt"></i> <span data-tr="BTN_DELETE_TEXT">Sil</span></button>
                        <!-- Kaydet: seçili personeli günceller (seçili yoksa ekler) · Ekle: her zaman yeni personel ekler -->
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-sm btn-primary" id="btnSavePersonel">
                                <i class="fas fa-save"></i>
                                <span data-tr="BTN_SAVE_TEXT">Kaydet</span>
                            </button>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="btnAddTogglePersonel">
                                    <span class="caret"></span>
                                    <span class="sr-only">Toggle Dropdown</span>
                                </button>
                                <div class="dropdown-menu dropdown-menu-right btn-add">
                                    <a class="dropdown-item btn-add" href="javascript:">
                                        <button class="btn btn-sm btn-primary btn-add" type="button" id="btnAddPersonel">
                                            <i class="fas fa-plus"></i>
                                            <span data-tr="BTN_ADD_TEXT">Ekle</span>
                                        </button>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="../../../lib/plugins/jquery-3.1.1/jquery-3.1.1.min.js"></script>
<script src="../../../lib/plugins/jquery-ui-1.12.1/jquery-ui.min.js"></script>
<script src="../../../lib/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/moment.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/locales.min.js"></script>
<script src="../../../lib/plugins/datetimepicker-4.17.47/js/bootstrap-datetimepicker.min.js"></script>
<script src="../../../lib/plugins/select2-4.0.12/js/select2.full.js"></script>
<script src="../../../lib/plugins/dataTables-1.10.20/datatables.min.js"></script>
<script src="../../../lib/plugins/jquery-validation-1.19.1/js/jquery.validate.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/i18n/grid.locale-en.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/jquery.jqGrid.min.js"></script>
<script src="../../../lib/plugins/noty-2.4.0/jquery.noty.packaged.js"></script>
<script src="../../../lib/app/js/lib.js?v=1.1.5"></script>
<script src="../../../lib/app/js/zippedPlugins.js"></script>
<script src="js/personel-1.0.0.js?v=1.0.0"></script>
</body>
</html>
