<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-tr="PAGE_TITLE">Form doldur</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/font-awesome-5.10.2/css/all.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/datetimepicker-4.17.47/css/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" href="../../../lib/app/css/plugins.css">
    <link rel="stylesheet" href="../css/hb.css?v=1.0.0">
    <style>
        .qm-info{ font-size: 12px; color: #667085; }
        .qm-count{ font-size: 12px; font-weight: 400; color: #667085; }
        .qm-forms{ max-height: 45vh; overflow: auto; }
        .qm-records{ max-height: 40vh; overflow: auto; }
        .qm-filter{ display: inline-flex; align-items: center; gap: 6px; background: #eef6ff; color: #1d4ed8; border-radius: 999px;
                    padding: 1px 4px 1px 9px; font-size: 11.5px; font-weight: 600; }
        .qm-filter .close{ font-size: 16px; line-height: 1; }
        /* Dosya listesi satırları (pcr_document liste kartı düzeni) */
        .custom-card .list-group-item.qm-row{ padding: .45rem .5rem .45rem 1.4rem; cursor: pointer; }
        .custom-card .list-group-item.qm-row.is-current{ background: #eef6ff; }
        .custom-card .list-group-item.qm-row.is-pending{ cursor: not-allowed; }
        .custom-card .list-group-item.qm-row.is-pending .qm-row-main{ opacity: .55; }
        .custom-card .list-group-item.qm-group{ background: #f7f8fa; color: #475467; font-weight: 600; font-size: 11px; text-transform: uppercase;
                                                letter-spacing: .3px; padding: 5px 10px; cursor: default; }
        .custom-card .list-group-item.qm-group:hover, .custom-card .list-group-item.qm-empty:hover{ box-shadow: none; }
        .custom-card .list-group-item.qm-empty{ color: #667085; font-size: 12px; }
        .qm-forms, .qm-records{ overflow-x: hidden; }
        .qm-row .widget-content{ padding: 0; }
        .qm-row .widget-content, .qm-row .widget-content-wrapper, .qm-row-main{ min-width: 0; }
        .qm-icon{ font-size: 1.9rem; width: 2rem; text-align: center; margin-right: .6rem; flex: 0 0 auto; }
        .qm-icon .fa-file-pdf{ color: #d92d20; }
        .qm-icon .fa-file-word{ color: #1d4ed8; }
        .qm-icon .fa-file-excel{ color: #157f3b; }
        .qm-icon .fa-file-signature{ color: #6941c6; }
        .qm-row .widget-heading{ font-size: 12.5px; }
        .qm-row .widget-heading .qm-badge{ margin-left: 2px; }
        .qm-row .widget-title{ font-size: 12px; color: #344054; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .qm-row .widget-subheading{ font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qm-actions{ flex: 0 0 auto; white-space: nowrap; margin-left: .25rem; }
        .qm-actions .btn{ padding: .2rem .4rem; }
        .qm-badge{ display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600; white-space: nowrap; background: #eceff3; color: #475467; }
        .qm-badge-wait{ background: #fff4d6; color: #8a5a00; }
        .qm-badge-new{ background: #dcfae6; color: #067647; }
        #PDFViewerFrame{ border: 0; width: 100%; height: 100%; }
        .qm-tools{ display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .qm-tools .btn.active{ background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
        .qm-hint{ font-size: 12px; color: #667085; margin: 6px 0; }
        .qm-viewer{ height: 70vh; overflow: auto; background: #525659; border-radius: 4px; padding: 10px 0; }
        .qm-page{ position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
        .qm-page canvas{ position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
        .qm-viewer.is-drawing .qm-ink{ touch-action: none; cursor: crosshair; }
        .qm-viewer.is-text .qm-ink{ cursor: text; }
        .qm-viewer.is-mark .qm-ink, .qm-viewer.is-eraser .qm-ink{ cursor: pointer; }
        .qm-viewer.is-pan .qm-ink{ pointer-events: none; }
        .qm-text-input{ position: absolute; z-index: 2; border: 1px dashed #1d4ed8; background: rgba(255,255,255,.85); color: #0b1f4d;
                        font-family: Arial, sans-serif; padding: 0 2px; line-height: 1.2; min-width: 60px; outline: none; }
        .qm-viewer .qm-msg{ color: #fff; text-align: center; padding: 40px 10px; }
        @media (max-width: 1199px){ .qm-col-form{ margin-top: 16px; } }
    </style>
    <!-- Biolab ortak tema: en son yüklenir (bootstrap düğme rengini kurumsal renge çeker) -->
    <link rel="stylesheet" href="../../../lib/app/css/biolab-theme.css?v=1.0.1">
</head>

<body class="frame-block">
<input type="hidden" id="clientId" name="clientId"/>
<div class="autoheight">
    <div class="container-fluid pt-3">
        <div class="row">

            <!-- Sol: formlar ve seçili formun kayıtları (dosya listesi kartı) -->
            <div class="col-xl-3">
                <div class="card custom-card shadow-sm">
                    <div class="card-header px-2">
                        <h5 class="mb-2"><i class="fa fa-folder-open mr-1 text-primary"></i> <span data-tr="FORMS_TITLE">Formlar</span>
                            <span class="qm-count" id="formCount"></span></h5>
                        <div class="input-group input-group-sm">
                            <div class="input-group-prepend"><span class="input-group-text"><i class="fa fa-search"></i></span></div>
                            <input type="text" id="searchField" class="form-control form-control-sm" data-trph="PH_SEARCH" placeholder="" autocomplete="off">
                        </div>
                    </div>
                    <div class="card-body p-0 qm-forms">
                        <ul class="list-wrapper list-group list-group-flush" id="formRows"></ul>
                    </div>
                    <div class="card-footer qm-info" data-tr="FORMS_INFO"></div>
                </div>
                <div class="card custom-card shadow-sm mt-3" id="recordsCard">
                    <div class="card-header px-2 d-flex align-items-center">
                        <h5 class="mb-0 flex-fill"><i class="fa fa-database mr-1 text-primary"></i> <span data-tr="RECORDS_TITLE">Kayıtlar</span>
                            <span class="qm-count" id="recordCount"></span></h5>
                        <!-- Form seçilince yalnızca o formun kayıtları; ✕ ile bütün kayıtlara dönülür -->
                        <span class="qm-filter" id="recordFilter" hidden><span></span>
                            <button type="button" class="close" id="btnClearFilter" aria-label="Close"><span aria-hidden="true">&times;</span></button></span>
                    </div>
                    <div class="card-body p-0 qm-records">
                        <ul class="list-wrapper list-group list-group-flush" id="recordRows"></ul>
                    </div>
                </div>
            </div>

            <!-- Sağ: araçlar ve form -->
            <div class="col-xl-9 qm-col-form">
                <div class="card">
                    <div class="card-header" style="background-color: #a5ccdfba">
                        <h3 class="card-title" data-tr="FORM_TITLE">Form</h3>
                    </div>
                    <div class="card-body">
                        <div id="formEmpty" class="text-muted" data-tr="FORM_EMPTY">Soldan doldurmak istediğiniz formu seçin.</div>
                        <div id="formArea" hidden>
                            <div class="mb-2" id="formHead"></div>
                            <div class="qm-tools">
                                <div class="btn-group btn-group-sm" role="group" id="tools">
                                    <button type="button" class="btn btn-default active" data-tool="pan"><i class="fas fa-hand-paper"></i> <span data-tr="TOOL_PAN">Kaydır</span></button>
                                    <button type="button" class="btn btn-default" data-tool="pen"><i class="fas fa-pen"></i> <span data-tr="TOOL_PEN">Kalem</span></button>
                                    <button type="button" class="btn btn-default" data-tool="text"><i class="fas fa-font"></i> <span data-tr="TOOL_TEXT">Yazı</span></button>
                                    <button type="button" class="btn btn-default" data-tool="check"><span data-tr="TOOL_CHECK">İşaret ✓</span></button>
                                    <button type="button" class="btn btn-default" data-tool="cross"><span data-tr="TOOL_CROSS">Çarpı ✗</span></button>
                                    <button type="button" class="btn btn-default" data-tool="eraser"><i class="fas fa-eraser"></i> <span data-tr="TOOL_ERASER">Silgi</span></button>
                                </div>
                                <label for="markSize" class="sr-only" data-tr="SIZE"></label>
                                <select id="markSize" class="form-control form-control-sm" style="width:auto">
                                    <option value="S" data-tr="SIZE_S">Küçük</option>
                                    <option value="M" data-tr="SIZE_M" selected>Orta</option>
                                    <option value="L" data-tr="SIZE_L">Büyük</option>
                                </select>
                                <button type="button" class="btn btn-sm btn-default" id="btnUndo"><i class="fas fa-undo"></i> <span data-tr="BTN_UNDO">Geri al</span></button>
                                <button type="button" class="btn btn-sm btn-default" id="btnClear"><i class="fas fa-trash-alt"></i> <span data-tr="BTN_CLEAR">Temizle</span></button>
                            </div>
                            <div class="qm-hint" id="hint"></div>
                            <div class="qm-viewer is-pan" id="viewer"></div>
                        </div>
                    </div>
                    <div class="card-footer" id="saveBar" hidden>
                        <div class="row">
                            <div class="col-md-8"><!--RECORD_TITLE-->
                                <label for="RECORD_TITLE" data-tr="RECORD_TITLE" class="col-form-label-sm">§§RECORD_TITLE</label>
                                <input type="text" id="RECORD_TITLE" class="form-control form-control-sm" maxlength="200" data-trph="PH_RECORD_TITLE" placeholder="">
                            </div>
                            <div class="col-md-4 text-right align-self-end">
                                <button type="button" class="btn btn-sm btn-primary" id="btnSave"><i class="fas fa-save"></i> <span data-tr="BTN_SAVE">Kaydet</span></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- PDF görüntüleyici (onaylı form ya da doldurulmuş kayıt) -->
<div class="modal fade modal-fit modal-fullscreen modal-fullscreen-w" id="modalShowPDF" tabindex="-1" role="dialog" aria-labelledby="modalShowPDFLabel">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalShowPDFLabel"></h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body d-flex flex-row m-0 p-0">
                <iframe id="PDFViewerFrame" name="PDFViewerFrame" class="flex-fill"></iframe>
            </div>
        </div>
    </div>
</div>

<script src="../../../lib/plugins/jquery-3.1.1/jquery-3.1.1.min.js"></script>
<script src="../../../lib/plugins/jquery-ui-1.12.1/jquery-ui.min.js"></script>
<script src="../../../lib/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/moment.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/locales.min.js"></script>
<script src="../../../lib/plugins/datetimepicker-4.17.47/js/bootstrap-datetimepicker.min.js"></script>
<script src="../../../lib/plugins/select2-4.0.12/js/select2.full.js"></script>
<script src="../../../lib/plugins/dataTables-1.10.20/datatables.min.js"></script>
<script src="../../../lib/plugins/jquery-validation-1.19.1/js/jquery.validate.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/i18n/grid.locale-en.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/jquery.jqGrid.min.js"></script>
<script src="../../../lib/plugins/noty-2.4.0/jquery.noty.packaged.js"></script>
<script src="../../../lib/plugins/pdfjs-2.6.347/pdf.js"></script>
<script src="../../../lib/app/js/lib.js?v=1.1.5"></script>
<script src="../../../lib/app/js/zippedPlugins.js"></script>
<script src="js/qmsRecord-1.0.0.js?v=1.0.6"></script>
</body>
</html>
