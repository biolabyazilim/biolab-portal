<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title data-tr="PAGE_TITLE">KVKK belgeleri</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">

    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap.css">
    <link rel="stylesheet" href="../../../lib/plugins/bootstrap/css/bootstrap-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/font-awesome-5.10.2/css/all.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/select2-4.0.12/css/select2-theme.css">
    <link rel="stylesheet" href="../../../lib/plugins/datetimepicker-4.17.47/css/bootstrap-datetimepicker.min.css">
    <link rel="stylesheet" href="../../../lib/plugins/jqGrid-4.6.0/css/ui.jqgrid.css">
    <link rel="stylesheet" href="../../../lib/plugins/jqGrid-4.6.0/css/ui.jqgrid.bootstrap.css">
    <link rel="stylesheet" href="../../../lib/app/css/plugins.css">
    <link rel="stylesheet" href="../css/hb.css?v=1.3.1">
    <style>
        .kv-info{
            margin-bottom: 8px;
            font-size: 12px;
            color: #667085;
        }
        .kv-badge{
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
        }
        .kv-badge-on  { background: #e3f4e9; color: #1e6b3a; }
        .kv-badge-off { background: #eceff3; color: #475467; }
        .kv-badge-warn{ background: #fff1d6; color: #9a6200; }
        @media (max-width: 991px){
            .kv-col-form{ margin-top: 16px; }
        }
    </style>
    <!-- Biolab ortak tema: en son yüklenir (bootstrap düğme rengini kurumsal renge çeker) -->
    <link rel="stylesheet" href="../../../lib/app/css/biolab-theme.css?v=1.0.1">
</head>

<body class="frame-block">
<input type="hidden" id="clientId" name="clientId"/>
<div class="autoheight">
    <div class="container-fluid pt-3">
        <div class="row">

            <!-- Sol: belge listesi -->
            <div class="col-lg-6 col-sm-6">
                <div class="card">
                    <div class="card-header" style="background-color: #a5ccdfba">
                        <h3 class="card-title" data-tr="LIST_TITLE" >Belgeler</h3>
                    </div>
                    <div class="card-body">

                        <div class="row grid-search mb-1">
                            <div class="col-sm-6"><!--FILTER_NODE_ID-->
                                <div class="form-group mb-1">
                                    <label for="FILTER_NODE_ID" class="sr-only" data-tr="FILTER_NODE_ID"></label>
                                    <select id="FILTER_NODE_ID" name="FILTER_NODE_ID" class="form-control form-control-sm"></select>
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="input-group input-group-sm">
                                    <label for="gridSearchField" class="sr-only" data-tr="PH_GRID_SEARCH_FIELD"></label>
                                    <input type="text" id="gridSearchField" name="gridSearchField" class="form-control form-control-sm" data-trph="PH_GRID_SEARCH_FIELD" placeholder="" autocomplete="off">
                                    <div class="input-group-append">
                                        <button class="btn btn-default btn-sm" type="button" data-tr="BTN_SEARCH_TEXT" id="btnGridSearch"></button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group col-sm-12">
                                <table id="jqGrid"></table>
                                <div id="jqGridPager"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Sağ: belge formu ve PDF versiyonları -->
            <div class="col-lg-6 col-sm-6 kv-col-form">
                <div class="card">
                    <div class="card-header" style="background-color: #c53cb61f">
                        <h3 class="card-title" data-tr="FORM_TITLE">Belge bilgisi</h3>
                    </div>
                    <div class="card-body">
                        <!-- Dosya da gönderildiği için form FormData ile (multipart) gönderilir -->
                        <form name="editFormDocument" id="editFormDocument" class="form-horizontal" method="post" enctype="multipart/form-data" action="javascript:" autocomplete="off" novalidate>

                            <input type="hidden" id="DOCUMENT_ID" name="DOCUMENT_ID"/>

                            <div class="form-group"><!--NODE_ID-->
                                <label for="NODE_ID" data-tr="NODE_ID" class="col-form-label-sm">§§NODE_ID</label>
                                <select id="NODE_ID" name="NODE_ID" class="form-control form-control-sm"></select>
                            </div>

                            <div class="form-group"><!--DOCUMENT_NAME-->
                                <label for="DOCUMENT_NAME" data-tr="DOCUMENT_NAME" class="col-form-label-sm">§§DOCUMENT_NAME</label>
                                <input type="text" id="DOCUMENT_NAME" name="DOCUMENT_NAME" class="form-control form-control-sm" maxlength="200"/>
                            </div>

                            <div class="row">
                                <div class="col-sm-4"><!--SORT_NO-->
                                    <div class="form-group">
                                        <label for="SORT_NO" data-tr="SORT_NO" class="col-form-label-sm">§§SORT_NO</label>
                                        <input type="number" id="SORT_NO" name="SORT_NO" class="form-control form-control-sm" min="0" max="999" value="0"/>
                                    </div>
                                </div>
                                <div class="col-sm-4"><!--PUBLISH_FL-->
                                    <div class="form-group">
                                        <label for="PUBLISH_FL" data-tr="PUBLISH_FL" class="col-form-label-sm">§§PUBLISH_FL</label>
                                        <select id="PUBLISH_FL" name="PUBLISH_FL" class="form-control form-control-sm base">
                                            <option value="Y" data-tr="FL_YES_TEXT"></option>
                                            <option value="N" data-tr="FL_NO_TEXT" selected></option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group"><!--DOCUMENT_FILE-->
                                <label for="DOCUMENT_FILE" data-tr="DOCUMENT_FILE" class="col-form-label-sm">§§DOCUMENT_FILE</label>
                                <input type="file" id="DOCUMENT_FILE" name="DOCUMENT_FILE" class="form-control-file form-control-sm" accept="application/pdf,.pdf"/>
                                <small class="form-text text-muted" data-tr="DOCUMENT_FILE_INFO"></small>
                            </div>

                        </form>
                    </div>
                    <div class="card-footer text-right">
                        <button type="button" class="btn btn-sm btn-success btn-new" id="btnNewDocument"><i class="fas fa-file"></i> <span data-tr="BTN_NEW_TEXT">Yeni</span></button>
                        <button type="button" class="btn btn-sm btn-default btn-cancel" id="btnCancelDocument"><i class="fas fa-ban"></i> <span data-tr="BTN_CANCEL_TEXT">İptal</span></button>
                        <button type="button" class="btn btn-sm btn-danger btn-delete" id="btnDeleteDocument"><i class="fas fa-trash-alt"></i> <span data-tr="BTN_DELETE_TEXT">Sil</span></button>
                        <!-- Kaydet: seçili belgeyi günceller (seçili yoksa ekler) · Ekle: her zaman yeni belge ekler (D.Sys menuWithTree düzeni) -->
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-sm btn-primary" id="btnSaveDocument">
                                <i class="fas fa-save"></i>
                                <span data-tr="BTN_SAVE_TEXT">Kaydet</span>
                            </button>
                            <div class="btn-group" role="group">
                                <button type="button" class="btn btn-sm btn-primary dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" id="btnAddToggleDocument">
                                    <span class="caret"></span>
                                    <span class="sr-only">Toggle Dropdown</span>
                                </button>
                                <div class="dropdown-menu dropdown-menu-right btn-add">
                                    <a class="dropdown-item btn-add" href="javascript:">
                                        <button class="btn btn-sm btn-primary btn-add" type="button" id="btnAddDocument">
                                            <i class="fas fa-plus"></i>
                                            <span data-tr="BTN_ADD_TEXT">Ekle</span>
                                        </button>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mt-3">
                    <div class="card-header">
                        <h3 class="card-title" data-tr="FILE_LIST_TITLE">Yüklenen PDF versiyonları</h3>
                    </div>
                    <div class="card-body">
                        <div class="kv-info" data-tr="FILE_LIST_INFO"></div>
                        <table id="jqGridFile"></table>
                        <div id="jqGridFilePager"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="../../../lib/plugins/jquery-3.1.1/jquery-3.1.1.min.js"></script>
<script src="../../../lib/plugins/jquery-ui-1.12.1/jquery-ui.min.js"></script>
<script src="../../../lib/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/moment.min.js"></script>
<script src="../../../lib/plugins/moment-2.24.0/min/locales.min.js"></script>
<script src="../../../lib/plugins/datetimepicker-4.17.47/js/bootstrap-datetimepicker.min.js"></script>
<script src="../../../lib/plugins/select2-4.0.12/js/select2.full.js"></script>
<script src="../../../lib/plugins/dataTables-1.10.20/datatables.min.js"></script>
<script src="../../../lib/plugins/jquery-validation-1.19.1/js/jquery.validate.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/i18n/grid.locale-en.js"></script>
<script src="../../../lib/plugins/jqGrid-4.6.0/js/jquery.jqGrid.min.js"></script>
<script src="../../../lib/plugins/noty-2.4.0/jquery.noty.packaged.js"></script>
<script src="../../../lib/app/js/lib.js?v=1.1.5"></script>
<script src="../../../lib/app/js/zippedPlugins.js"></script>
<script src="js/kvkkDocument-1.0.0.js?v=1.0.2"></script>
</body>
</html>
