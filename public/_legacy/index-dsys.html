<script id="clientList-template" type="text/x-handlebars-template">
    {{#each this}}

        <div class="patient-row user-list--onhover search-result-row"
             data-id="{{patientId}}"
             data-name="{{patientName}} {{patientSurname}}"
             data-fileNo="{{patientNumber}}">
            <div class="profile-image {{#xif 'genderAbr == "F"'}}woman{{ else }}{{#xif 'genderAbr == "M"'}}man{{ else }} {{/xif}}{{/xif}}">
                <img src="{{#if avatarFilePath}}./module/pcr_files/php/files/stored/{{avatarFilePath}}{{else}}./lib/app/css/images/{{#xif 'genderAbr == "F"'}}avatar-woman.png{{ else }}{{#xif 'genderAbr == "M"'}}avatar-man.png{{ else }}avatar-noname.png{{/xif}}{{/xif}}{{/if}}" alt="profile-image">
            </div>
           <div class="text">
                <div class="name-container">
                    <div class="patient-name">
                        <h6>{{patientName}} {{patientSurname}}</h6>
                    </div>
                </div>
                <div class="info-container">
                    <div class="patient-number">
                        <h6 class="text-muted">{{patientNumber}}</h6>
                        <h6 class="text-muted">&nbsp;</h6>
                        <h6 class="text-muted">{{#round age 0}}{{/round}}</h6>
                    </div>
                    <div class="patient-status flex-fill text-center">
                        <h6 class="text-muted">{{hmcNumber}}&nbsp;</h6>
                    </div>
                    <div class="medical-info">
                        <span class="{{#xif 'hbsagPosFl == "Y"'}}active{{/xif}}" title="data-tr=TITLE_HBSAG">B</span>
                        <span class="{{#xif 'hcvPosFl == "Y"'}}active{{/xif}}" title="data-tr=TITLE_HCV">C</span>
                        <span class="{{#xif 'hivPosFl == "Y"'}}active{{/xif}}" title="data-tr=TITLE_HIV">H</span>
                        <span class="{{#xif 'diabetesPosFl == "Y"'}}active{{/xif}}" title="data-tr=TITLE_DIABETES">D</span>
                    </div>
                </div>
            </div>
        </div>
    {{/each}}
</script>

<!--                        <span class="{{#xif 'allergy > "0"'}}active{{/xif}}" title="data-tr=TITLE_ALLERGY">A</span>-->
<script id="clientList-template-bck" type="text/x-handlebars-template">
    {{#each this}}

    <div class="search-result-row"
         data-id="{{patientId}}"
         data-name="{{patientName}} {{patientSurname}}"
         data-fileNo="{{patientNumber}}">
        <div class="first-row">{{patientNumber}}-{{patientName}} {{patientSurname}}</div>
        <div class="second-row">
            <span class="gender">
                {{#xif 'genderAbr == "F"'}}<i class="fas fa-venus"></i>{{/xif}}
                {{#xif 'genderAbr == "M"'}}<i class="fas fa-mars"></i>{{/xif}}
            </span>
            <span class="age">
                {{#round age 0}}{{/round}}
            </span>
            <span class="medical-info float-right d-flex flex-row">
                <span class="mr-1 badge {{#xif 'allergy > "0"'}}badge-danger{{else}}badge-disable{{/xif}}">A</span>
                <span class="mr-1 badge {{#xif 'hbsagPosFl == "Y"'}}badge-danger{{else}}badge-disable{{/xif}}">B</span>
                <span class="mr-1 badge {{#xif 'hcvPosFl == "Y"'}}badge-danger{{else}}badge-disable{{/xif}}">C</span>
                <span class="badge {{#xif 'diabetesPosFl == "Y"'}}badge-danger{{else}}badge-disable{{/xif}}">D</span>
            </span>
        </div>
    </div>
    {{/each}}
</script>
